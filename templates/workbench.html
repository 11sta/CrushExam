<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CrushExam · 当前学习任务</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#182334;background:#f4f6fa;font-synthesis:none}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{background:#17283e;color:white;padding:22px max(24px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:22px;letter-spacing:.4px}header span{font-size:13px;opacity:.8}.layout{max-width:1140px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:24px}aside,.card{border:1px solid #dde4ed;background:white;border-radius:16px;padding:24px;min-width:0}aside{align-self:start}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:#58708b}.phase{display:flex;gap:8px;align-items:center;margin:14px 0;color:#4b5c71;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#b3c2d4}.phase.current{font-weight:700;color:#235ba8}.current .dot{background:#235ba8;box-shadow:0 0 0 4px #e7effa}h1{font-size:23px;line-height:1.45;margin:8px 0 12px}h2{font-size:16px;line-height:1.5;margin:10px 0}.muted{color:#5c6b7f;font-size:13px;line-height:1.7}.label{display:inline-block;background:#edf3fc;border:1px solid #d5e3f8;color:#234e87;border-radius:20px;padding:5px 10px;font-size:12px}.stem{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:17px;margin:20px 0}.options{display:grid;gap:10px;margin:12px 0 20px}.option{border:1px solid #dce3ed;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;background:white;color:inherit;font:inherit;transition:border-color .15s,background .15s}.option:hover,.option:focus-visible{border-color:#235ba8;background:#f0f5fc}.option.selected{border:2px solid #235ba8;background:#edf3fc;padding:11px 13px}label{font-size:14px}textarea{width:100%;min-height:126px;resize:vertical;line-height:1.7;padding:13px 14px;border:1px solid #b9c8dc;border-radius:10px;font:inherit;margin-top:8px;background:#fff}textarea:focus{outline:3px solid #dfebfb;border-color:#235ba8}button.primary{background:#235ba8;border:1px solid #235ba8;color:white;border-radius:9px;padding:11px 16px;font:inherit;cursor:pointer}button.secondary{border:1px solid #becbda;background:white;color:#324a68;border-radius:9px;padding:11px 14px;font:inherit;cursor:pointer}button:disabled{opacity:.48;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 10px}.hint{display:flex;align-items:center;gap:8px;color:#5c6b7f;margin:10px 0}.notice{padding:12px 14px;border-radius:10px;background:#f0f5fc;font-size:13px;line-height:1.8;margin:12px 0}.notice.warn{background:#fff4dd;color:#79581e}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #e4e9f0;padding-top:18px;margin-top:20px}.number{font-size:24px;font-weight:650}.stats small{display:block;font-size:12px;color:#66778c;margin-top:4px}details{border-top:1px solid #e4e9f0;padding-top:15px;margin-top:20px}summary{cursor:pointer;color:#3b536f;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:14px;line-height:1.75}.figures img{max-width:100%;height:auto;display:block;margin:12px 0;border:1px solid #e4e9f0;border-radius:8px}.feedback{padding:16px;background:#f5f8fc;border-radius:10px;margin:18px 0}footer{max-width:1140px;margin:24px auto;padding:0 24px 28px;font-size:12px;color:#6b7a8e;line-height:1.7}@media(max-width:760px){header{padding:18px 20px;align-items:flex-start;flex-direction:column}.layout{margin:18px auto;padding:0 16px;grid-template-columns:minmax(0,1fr);gap:16px}aside{padding:18px}aside{order:2}main.card{order:1}.phases{display:flex;flex-wrap:wrap;gap:8px 16px}.phase{margin:8px 0}.stats{margin-top:12px;padding-top:12px}.card{padding:20px}h1{font-size:21px}.stem{font-size:16px}.actions button{flex:1}footer{padding:0 16px 20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><strong>CrushExam</strong><span id="course"></span></header><div class="layout"><aside><div class="eyebrow">当前任务</div><h2 id="taskTitle"></h2><div class="phases" id="phases"></div><div class="muted" id="criterion"></div><div class="stats"><div><div class="number" id="count"></div><small>实际判分次数</small></div><div><div class="number" id="taskCount"></div><small>本次任务收束</small></div></div><p class="muted">学习结束 ≠ 全部掌握。无提示作答、受助完成和跨日复测分别记录。</p></aside><main class="card"><span class="label" id="stage"></span><h1 id="questionTitle">一次只解决当前这一题</h1><div id="context" class="notice" hidden></div><div class="stem" id="stem"></div><div class="figures" id="figures"></div><div class="options" id="options"></div><div id="answerArea"><label for="response">写下你的原答与关键步骤</label><textarea id="response" placeholder="先独立作答；不确定也可以写出思路。"></textarea><label class="hint"><input type="checkbox" id="hinted">本次作答使用过提示或先看过解答</label><div class="actions"><button class="primary" id="submit">保存并导出原答</button><button class="secondary" id="defer">本题暂缓</button><button class="secondary" id="again" hidden>再次导出同一份原答</button></div></div><div class="notice" id="receipt" aria-live="polite">此页面离线运行。导出后，把 JSON 作答文件交回对话中的教练，导入后才会判分和更新进度。</div><div class="feedback" id="feedback" hidden></div><details><summary>查看出处与证据边界</summary><pre id="source"></pre><div class="muted">页面不包含未提交题目的参考答案。浏览器中的作答保存不等于已写回学习工作区；以教练导入后的记录为准。独立性依据可观察记录及学生自报，不是监考结论。</div></details></main></div><footer>CrushExam 1.7.0 · 本地资料、原答留痕、可恢复任务 · 不联网、不生成考试成绩预测</footer>
<script id="data" type="application/json">__CRUSHEXAM_DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent), $=id=>document.getElementById(id);
function text(id,value){$(id).textContent=value==null?'':String(value)}
text('course',D.course+' · '+D.exam_id);text('taskTitle',D.task?D.task.label:'当前练习 / 本次反馈');
text('criterion',D.task?D.task.pass_criteria:'依据真实作答判断，不用阅读完成代替独立验证。');
text('count',D.counts.attempts);text('taskCount',D.counts.tasks_done+'/'+D.counts.tasks_total);
const labels={explain:'补讲规则',guided:'例题带做',independent:'独立作答',feedback:'核对反馈'};
const pkey=D.status==='graded'?'feedback':D.task&&D.task.phase;
const visiblePhase=({awaiting_step:'guided',step_check:'guided',remediation:'explain',method_check:'feedback'}[pkey]||pkey);
for(const [key,label] of Object.entries(labels)){let el=document.createElement('div');el.className='phase'+(visiblePhase===key?' current':'');let dot=document.createElement('span');dot.className='dot';el.append(dot,document.createTextNode(label));$('phases').appendChild(el)}
text('stage',D.status==='presented'?'等待你的原答':D.status==='graded'?'本题已反馈':'已保存 / 暂无未答题');text('stem',D.question);
if(D.context){$('context').hidden=false;text('context','共享题干：'+D.context)}
for(const url of D.figures){const im=new Image();im.src=url;im.alt='资料原题配图';$('figures').appendChild(im)}
text('source',D.source?D.source.file+' p.'+D.source.page+'\n作答编号：'+D.attempt_id:'当前没有原题');
const key='crushexam:'+D.exam_id+':'+D.attempt_id;let receipt=null,storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.attempt_id===D.attempt_id&&saved.delivery_token===D.delivery_token)receipt=saved}catch(e){storageAvailable=false}
const enabled=D.status==='presented';
for(const [i,opt] of D.options.entries()){const button=document.createElement('button');button.type='button';button.className='option';button.setAttribute('aria-pressed','false');button.textContent=opt;button.disabled=!enabled;button.onclick=()=>{if(receipt)return;$('response').value=(String(opt).match(/^[A-Ha-h]/)||[String.fromCharCode(65+i)])[0].toUpperCase();document.querySelectorAll('.option').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});button.classList.add('selected');button.setAttribute('aria-pressed','true')};$('options').appendChild(button)}
function download(data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CrushExam-answer-'+data.attempt_id+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function lock(){ $('response').disabled=true;$('hinted').disabled=true;$('submit').disabled=true;$('defer').disabled=true;document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(receipt){$('again').hidden=false;$('response').value=receipt.response||'';text('receipt',storageAvailable?'原答已在本页冻结。请将导出的 JSON 交回教练导入；再次导出不会改写这份原答。':'本页原答已冻结，但浏览器不允许持久保存。请保留导出的 JSON 并交回教练；关闭或刷新页面后，不能依赖浏览器恢复，后端以首次成功导入的原答为准。')}}
function commit(action){if(!enabled||receipt)return;const response=$('response').value;if(action==='submit'&&!response.trim()){text('receipt','请先填写原答，也可选择暂缓。');return}receipt={schema:'crushexam-submission-v1',exam_id:D.exam_id,attempt_id:D.attempt_id,qid:D.qid,item_version:D.item_version,delivery_token:D.delivery_token,action,response,hinted:$('hinted').checked,client_timestamp:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(receipt))}catch(e){storageAvailable=false}lock();download(receipt)}
$('submit').onclick=()=>commit('submit');$('defer').onclick=()=>commit('defer');$('again').onclick=()=>receipt&&download(receipt);
if(receipt)lock();if(!enabled){$('response').value=D.raw_answer||'';lock()}
if(D.feedback){text('questionTitle','本题反馈');$('answerArea').hidden=true;$('options').hidden=true;text('receipt','本题已写入学习工作区。回到对话继续下一步或结束本次，无需再次导出原答。');$('feedback').hidden=false;const h=document.createElement('strong');h.textContent=(D.feedback.result==='right'?'正确':'需要修正')+' · '+(D.feedback.evidence_label||D.feedback.evidence_level);$('feedback').appendChild(h);const pre=document.createElement('pre');pre.textContent='你的原答：'+(D.raw_answer||'')+'\n'+(D.feedback.note||'')+'\n参考解答：\n'+(D.feedback.reference||'');$('feedback').appendChild(pre);for(const c of ((D.feedback.rubric||{}).criteria||[])){const row=document.createElement('p');row.className='muted';row.textContent=c.label+'：'+({met:'完成',partial:'部分完成',missing:'缺失',uncertain:'待核对',unassessed:'漏评待核对'}[c.status]||c.status);$('feedback').appendChild(row)}}
</script></body></html>
